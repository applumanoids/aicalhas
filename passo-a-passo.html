<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppCalhas · Passo a passo</title>

<style>
  :root {
    --storm: #13202c; --storm-2: #1b2c3b; --ink: #142230; --ink-2: #2f4050; --muted: #5d6d7c; --faint: #8796a4;
    --line: #dfe6ec; --bg: #eef2f5; --surface: #fff; --surface-2: #f6f8fa;
    --copper: #b8612e; --copper-ink: #8e4720; --copper-soft: #f8eadf; --rain: #1b87c9;
    --flow: #46566a;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
    --font-d: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { font-family: var(--font-d); line-height: 1.15; margin: 0; }
  a { color: var(--copper-ink); }
  .wrap { width: min(1440px, 100% - 32px); margin: 0 auto; }

  header.top { background: linear-gradient(170deg, #0e1a25 0%, #15283a 60%, #1d3c55 100%); color: #cfdbe6; }
  header.top .wrap { padding: 22px 0 20px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .logo { display: inline-flex; align-items: center; gap: 9px; color: #fff; text-decoration: none; font-family: var(--font-d); font-size: 19px; }
  .logo b { font-weight: 700; } .logo span { color: #e8a06a; }
  header.top h1 { color: #fff; font-size: clamp(26px, 3.4vw, 36px); margin: 10px 0 6px; }
  header.top p { margin: 0; max-width: 820px; color: #b9c8d6; }
  .hl { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 9px; font: 600 14px var(--font); text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--copper); }
  .btn.p { background: var(--copper); border-color: var(--copper); color: #fff; }
  .btn.p:hover { background: var(--copper-ink); }
  .btn.l { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.24); }
  .btn.sm { min-height: 34px; padding: 0 11px; font-size: 13px; }
  .btn[disabled] { opacity: .45; cursor: default; }

  .tabs { position: sticky; top: 0; z-index: 10; background: rgba(238,242,245,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .tabs .wrap { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: thin; }
  .tab { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font: 600 13.5px var(--font); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .tab b { font-family: var(--font-d); color: var(--copper); margin-right: 4px; }
  .tab[aria-selected="true"] { background: var(--storm); color: #fff; border-color: var(--storm); }
  .tab[aria-selected="true"] b { color: #e8a06a; }

  .intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; margin: 20px 0 12px; }
  .intro h2 { font-size: 24px; margin-bottom: 4px; }
  .intro p { margin: 0; color: var(--muted); max-width: 860px; }
  .st { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 12.5px; }
  .st .lb { color: var(--muted); font-weight: 600; margin-right: 2px; }
  .st span.s { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--ink-2); }
  .st i { color: var(--faint); font-style: normal; }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .board { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(19,32,44,.05), 0 4px 14px rgba(19,32,44,.06); }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .bar .sp { flex: 1; }
  .bar select { font: 600 13px var(--font); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; color: var(--ink); }
  .zoom { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #fff; }
  .zoom button { border: 0; background: #fff; min-width: 34px; height: 32px; font: 700 14px var(--font); color: var(--ink-2); cursor: pointer; }
  .zoom button + button { border-left: 1px solid var(--line); }
  .zoom button:hover { background: var(--surface-2); }
  .canvas { overflow: auto; max-height: 76vh; background: #fff; }
  .canvas svg { display: block; }
  .cap { display: none; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--storm); color: #d4e0ea; font-size: 14px; }
  .cap.on { display: flex; }
  .cap b { color: #fff; font-family: var(--font-d); font-size: 15px; }
  .cap .n { flex: none; background: var(--copper); color: #fff; border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 12.5px; }

  .panel { position: sticky; top: 64px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 1px 2px rgba(19,32,44,.05), 0 4px 14px rgba(19,32,44,.06); }
  .panel h3 { font-size: 20px; margin: 8px 0 10px; }
  .panel .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; }
  .panel dl { margin: 0; display: grid; gap: 10px; }
  .panel dt { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .panel dd { margin: 2px 0 0; font-size: 14.5px; color: var(--ink); }
  .panel .hint { color: var(--muted); font-size: 14px; }
  .panel ul { margin: 4px 0 0; padding-left: 18px; }
  .panel .go { margin-top: 14px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 14px; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend svg { flex: none; }

  .lst { margin: 22px 0 10px; }
  .lst summary { cursor: pointer; font-family: var(--font-d); font-weight: 700; font-size: 17px; color: var(--copper-ink); margin-bottom: 10px; }
  table.t { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
  .t th, .t td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .t thead th { background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); }
  .t tr:last-child td { border-bottom: 0; }
  .t td.n { font-family: var(--font-d); font-weight: 700; color: var(--copper); width: 44px; }
  .t .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
  .t .who i { width: 9px; height: 9px; border-radius: 50%; }
  .t tr.exc td { background: #fffaf3; }
  .t small { color: var(--muted); display: block; }
  .tw { overflow-x: auto; border-radius: 12px; }

  /* SVG */
  .nd { cursor: pointer; outline: none; }
  .nd .hit { fill: transparent; }
  .nd:hover .shape, .nd:focus-visible .shape { filter: drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 3px 6px rgba(19,32,44,.18)); }
  .nd.sel .ring { opacity: 1; }
  .nd .ring { opacity: 0; fill: none; stroke: var(--copper); stroke-width: 3; }
  .nd.on .ring { opacity: 1; stroke: #e8a06a; stroke-width: 4; }
  .nd.on .shape { filter: drop-shadow(0 4px 10px rgba(184,97,46,.45)); }
  .ed path.ln { fill: none; stroke: var(--flow); stroke-width: 1.6; stroke-linejoin: round; }
  .ed path.halo { fill: none; stroke: #fff; stroke-width: 7; stroke-linejoin: round; }
  .ed.on path.ln { stroke: var(--copper); stroke-width: 3; }
  .ed.dim path.ln { opacity: .35; }
  .ed text { font-size: 10.5px; fill: var(--ink-2); font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .ed.on text { fill: var(--copper-ink); }
  text.lbl { font-size: 11px; fill: var(--ink); }
  text.lbl.b { font-weight: 600; }
  text.lane { font-family: var(--font-d); font-weight: 700; font-size: 14px; }
  text.lsub { font-size: 10.5px; fill: var(--muted); }

  footer { margin: 34px 0 0; padding: 22px 0 30px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

  @media (max-width: 1100px) {
    .stage { grid-template-columns: 1fr; }
    .panel { position: static; }
  }
  @media (max-width: 640px) {
    .wrap { width: calc(100% - 24px); }
    .intro { grid-template-columns: 1fr; }
    .hl { margin-left: 0; }
    .canvas { max-height: 64vh; }
    .t { font-size: 13px; }
  }
  @media print {
    .tabs, .bar, .hl, .panel { display: none; }
    .stage { grid-template-columns: 1fr; }
    .canvas { max-height: none; overflow: visible; }
  }
</style>
</head>

      <h1>Como funciona, passo a passo</h1>

        <button class="btn sm p" id="bPlay" type="button">▶ Simular</button>
        <button class="btn sm" id="bPrev" type="button" aria-label="Passo anterior">◀</button>

        <button class="btn sm" id="bStop" type="button">Reiniciar</button>
        <span class="sp"></span>
        <div class="zoom" role="group" aria-label="Zoom"><button type="button" id="zOut" aria-label="Diminuir">−</button><button type="button" id="zFit" aria-label="Ajustar à largura" style="font-size:12px;padding:0 8px">Ajustar</button><button type="button" id="zIn" aria-label="Aumentar">+</button></div>
      </div>
      <div class="canvas" id="canvas"></div>
      <div class="cap" id="cap"><span class="n" id="capN"></span><div><b id="capT"></b><div id="capD"></div></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <details class="lst">
    <summary id="lTitle">Ver os passos em lista</summary>
    <div class="tw"><table class="t" id="lTable"></table></div>
  </details>

  <footer>AppCalhas · Ambiente demonstrativo.</footer>
</main>

    if (d.saida) rows.push(['Resultado', esc(d.saida)]);
    if (d.sla) rows.push(['Prazo', esc(d.sla)]);
    if (n.t === 'gw' || n.t === 'par') {
      var outs = D[cur].edges.filter(function (e) { return e[0] === id; });
      rows.push([n.t === 'par' ? 'Acontece ao mesmo tempo' : 'Caminhos possíveis', '<ul>' + outs.map(function (e) { return '<li>' + (e[2] ? '<b>' + esc(e[2]) + '</b> → ' : '') + esc(G.N[e[1]].n || TYPE[G.N[e[1]].t]) + '</li>'; }).join('') + '</ul>']);
    }
    if (n.t === 'note') rows.push(['Observação', esc(n.n)]);
    var go = n.go ? '<div class="go"><button type="button" class="btn p" data-go="' + n.go + '">' + (n.t === 'sub' ? 'Ver esta fase' : 'Ir para: ' + esc(D[n.go].title)) + '</button></div>' : '';
    $('panel').innerHTML = '<div class="chips">' + laneChip(n.l) + '</div><h3>' + esc(n.t === 'note' ? 'Anotação' : n.n || TYPE[n.t]) + '</h3>' +
      (rows.length ? '<dl>' + rows.map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>'; }).join('') + '</dl>' : '<p class="hint">Sem detalhes adicionais.</p>') + go;
  }
  $('panel').addEventListener('click', function (ev) { var b = ev.target.closest('[data-go]'); if (b) { open(b.dataset.go); window.scrollTo({ top: 0, behavior: 'smooth' }); } });

  function select(id) {
    document.querySelectorAll('.nd.sel').forEach(function (x) { x.classList.remove('sel'); });
    var g = canvas.querySelector('.nd[data-id="' + id + '"]'); if (g) g.classList.add('sel');
    sel = id; panelNode(id);
  }
  canvas.addEventListener('click', function (ev) { var g = ev.target.closest('.nd'); if (g) { stop(true); select(g.dataset.id); } });
  canvas.addEventListener('dblclick', function (ev) { var g = ev.target.closest('.nd'); if (g) { var n = G.N[g.dataset.id]; if (n && n.go) open(n.go); } });
  canvas.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { var g = ev.target.closest('.nd'); if (g) { ev.preventDefault(); select(g.dataset.id); } } });

  /* Simulação */
  function clearHi() {
    canvas.querySelectorAll('.nd.on').forEach(function (x) { x.classList.remove('on'); });
    canvas.querySelectorAll('.ed').forEach(function (x) { x.classList.remove('on', 'dim'); x.querySelector('.ln').setAttribute('marker-end', 'url(#ar)'); });
  }
  function step(i) {
    var p = sim.path; if (i < 0 || i >= p.length) return;
    sim.i = i; clearHi();
    canvas.querySelectorAll('.ed').forEach(function (x) { x.classList.add('dim'); });
    for (var k = 0; k <= i; k++) {
      var g = canvas.querySelector('.nd[data-id="' + p[k] + '"]');
      if (k === i && g) g.classList.add('on');
      if (k > 0) { var ed = canvas.querySelector('.ed[data-e="' + p[k - 1] + '>' + p[k] + '"]'); if (ed) { ed.classList.remove('dim'); ed.classList.add('on'); ed.querySelector('.ln').setAttribute('marker-end', 'url(#aro)'); } }
    }
    var n = G.N[p[i]], d = n.d || {};
    $('cap').classList.add('on'); $('capN').textContent = 'Passo ' + (i + 1) + ' de ' + p.length;
    $('capT').textContent = (n.n || TYPE[n.t]) + ' — ' + LANES[n.l].n;
    var out = '';
    if (n.t === 'gw' && i + 1 < p.length) { var e = D[cur].edges.find(function (x) { return x[0] === p[i] && x[1] === p[i + 1]; }); out = e && e[2] ? 'Resposta neste caminho: ' + e[2] + '.' : ''; }
    $('capD').textContent = d.oque || out || TYPE[n.t];
    panelNode(p[i]);
    var gEl = canvas.querySelector('.nd[data-id="' + p[i] + '"]');
    if (gEl) { var nx = n.x * scale, ny = n.y * scale; canvas.scrollTo({ left: Math.max(0, nx - canvas.clientWidth / 2), top: Math.max(0, ny - canvas.clientHeight / 2), behavior: 'smooth' }); }
    $('bPrev').disabled = i === 0; $('bNext').disabled = i === p.length - 1;
  }
  function stop(keepPanel) {
    clearInterval(sim.timer); sim.timer = null; sim.i = -1; $('bPlay').textContent = '▶ Simular';
    if (canvas.querySelector('svg')) clearHi();
    $('cap').classList.remove('on'); $('bPrev').disabled = true; $('bNext').disabled = false;
    if (!keepPanel && G) panelIntro();
  }
  $('bPlay').onclick = function () {
    if (sim.timer) { clearInterval(sim.timer); sim.timer = null; $('bPlay').textContent = '▶ Continuar'; return; }
    sim.path = D[cur].sims[+$('simSel').value].p;
    if (sim.i < 0 || sim.i >= sim.path.length - 1) step(0);
    $('bPlay').textContent = '⏸ Pausar';
    sim.timer = setInterval(function () { if (sim.i >= sim.path.length - 1) { clearInterval(sim.timer); sim.timer = null; $('bPlay').textContent = '↺ Repetir'; sim.i = -1; return; } step(sim.i + 1); }, 1900);
  };
  $('bNext').onclick = function () { clearInterval(sim.timer); sim.timer = null; $('bPlay').textContent = '▶ Continuar'; sim.path = D[cur].sims[+$('simSel').value].p; step(sim.i < 0 ? 0 : Math.min(sim.path.length - 1, sim.i + 1)); };
  $('bPrev').onclick = function () { clearInterval(sim.timer); sim.timer = null; $('bPlay').textContent = '▶ Continuar'; step(Math.max(0, sim.i - 1)); };
  $('bStop').onclick = function () { stop(); };
  $('simSel').onchange = function () { stop(); };

  /* Roteiro em texto */
  function list() {
    var dg = D[cur], main = dg.sims[0].p, seen = {}, rows = [], k = 0;
    main.forEach(function (id) { if (seen[id]) return; seen[id] = 1; var n = G.N[id]; if (n.t === 'note') return; rows.push({ n: n, exc: false }); });
    dg.nodes.forEach(function (x) { if (!seen[x.id] && x.t !== 'note' && x.t !== 'par') { seen[x.id] = 1; rows.push({ n: G.N[x.id], exc: true }); } });
    $('lTable').innerHTML = '<thead><tr><th>#</th><th>Quem</th><th>Etapa</th><th>O que acontece</th></tr></thead><tbody>' + rows.map(function (r) {
      var n = r.n, d = n.d || {}, C = LANES[n.l];
      if (n.t === 'par') return '';
      k++;
      var outs = (n.t === 'gw') ? dg.edges.filter(function (e) { return e[0] === n.id; }).map(function (e) { return (e[2] || '') + ' → ' + (G.N[e[1]].n || TYPE[G.N[e[1]].t]); }).join('; ') : '';
      return '<tr class="' + (r.exc ? 'exc' : '') + '"><td class="n">' + k + '</td><td><span class="who"><i style="background:' + C.c + '"></i>' + esc(C.n) + '</span></td><td><b>' + esc(n.n || TYPE[n.t]) + '</b>' + (r.exc ? '<small>Caminho alternativo</small>' : '') + '</td><td>' + esc(d.oque || '') + (outs ? '<small>' + esc(outs) + '</small>' : '') + '</td></tr>';
    }).join('') + '</tbody>';
  }

  window.addEventListener('resize', function () { clearTimeout(window.__rz); window.__rz = setTimeout(fit, 150); });
  var h = (location.hash || '').slice(1);
  open(D[h] ? h : 'geral');
})();
</script>
</body>
</html>

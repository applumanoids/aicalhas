<style>
  /* Cenário 3 v2 — materiais integrados ao atendimento */
  .kb { grid-template-columns: repeat(6, minmax(190px, 1fr)); }
  .kb.c3-kb5 { grid-template-columns: repeat(5, minmax(200px, 1fr)); }
  .c3-blk { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; margin-top: 14px; background: #fff; }

  .c3-tot { border-color: var(--acc); background: var(--acc-soft); }
  .stp.c3-mini li { min-width: 40px; }
  .stp.c3-mini .sl { display: none; }
  .stp.c3-mini .dot { width: 22px; height: 22px; font-size: 10px; }
  .stp.c3-mini li::before { top: 10px; }
  .ied-p[readonly] { background: var(--surface-2); color: var(--ink-2); pointer-events: none; }
  /* Botão "Veja o passo a passo" */
  .top .guide { flex: none; text-decoration: none; margin-right: 6px; }
  .sbtn.guide-s { color: #fff; background: rgba(184, 97, 46, .35); }
  .sbtn.guide-s:hover { background: rgba(184, 97, 46, .55); }

  .ab-a .btn { text-decoration: none; }
